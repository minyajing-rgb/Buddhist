<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#FBF8F2"/>
<style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#1E2A44}.h{font-size:52px;font-weight:800}.s{font-size:22px;fill:#667085}.b{font-size:19px;font-weight:800}.m{font-size:15px;fill:#667085}.box{fill:#fff;stroke:#E0D7C9;stroke-width:2}.ln{stroke:#B8AD9D;stroke-width:4;fill:none}.root{fill:#1E2A44}.roottext{fill:#fff;font-family:Arial,'Noto Sans SC',sans-serif;font-weight:800;font-size:23px}</style>
<text x="70" y="80" class="t h">Buddhist Textual Tradition Graph</text><text x="70" y="120" class="t s">佛典传统关系图｜比“宗派树”更接近真实：大量平行、交叉、翻译与再编纂</text>
<rect x="600" y="165" width="400" height="80" rx="24" class="root"/><text x="800" y="214" text-anchor="middle" class="roottext">EARLY SHARED LAYERS｜早期共同层</text>
<path d="M800 245V320M800 320H300M800 320H1300M800 320V380" class="ln"/>
<rect x="120" y="350" width="360" height="160" rx="22" class="box"/><text x="300" y="395" text-anchor="middle" class="t b">Discourses / 经</text><text x="155" y="432" class="t m">Pāli Nikāyas</text><text x="155" y="458" class="t m">Chinese Āgamas</text><text x="155" y="484" class="t m">Sanskrit / Gāndhārī / Tibetan parallels</text>
<rect x="620" y="350" width="360" height="160" rx="22" class="box"/><text x="800" y="395" text-anchor="middle" class="t b">Vinaya / 律</text><text x="655" y="432" class="t m">multiple disciplinary lineages</text><text x="655" y="458" class="t m">不同部派律藏及其译本</text>
<rect x="1120" y="350" width="360" height="160" rx="22" class="box"/><text x="1300" y="395" text-anchor="middle" class="t b">Abhidharma / 论</text><text x="1155" y="432" class="t m">systematic doctrinal analysis</text><text x="1155" y="458" class="t m">不同部派的体系化发展</text>
<path d="M300 510V600M800 510V600M1300 510V600M300 600H1300" class="ln"/>
<rect x="100" y="650" width="300" height="250" rx="22" class="box"/><text x="250" y="700" text-anchor="middle" class="t b">Pāli Tradition</text><text x="135" y="740" class="t m">Tipiṭaka</text><text x="135" y="768" class="t m">Commentaries</text><text x="135" y="796" class="t m">Sri Lanka → SE Asia</text><text x="135" y="840" class="t m">重点：连续保存的巴利文本传统</text>
<rect x="450" y="650" width="300" height="250" rx="22" class="box"/><text x="600" y="700" text-anchor="middle" class="t b">Indian Mahāyāna</text><text x="485" y="740" class="t m">Prajñāpāramitā</text><text x="485" y="768" class="t m">Lotus · Avataṃsaka · Pure Land</text><text x="485" y="796" class="t m">Madhyamaka · Yogācāra</text><text x="485" y="824" class="t m">Tathāgatagarbha · Tantra</text>
<rect x="800" y="650" width="300" height="250" rx="22" class="box"/><text x="950" y="700" text-anchor="middle" class="t b">Chinese Canon(s)</text><text x="835" y="740" class="t m">translations from India/Central Asia</text><text x="835" y="768" class="t m">multiple translations & recensions</text><text x="835" y="796" class="t m">Chinese commentaries & compositions</text><text x="835" y="824" class="t m">historical canons → Taishō</text>
<rect x="1150" y="650" width="300" height="250" rx="22" class="box"/><text x="1300" y="700" text-anchor="middle" class="t b">Tibetan Canon(s)</text><text x="1185" y="740" class="t m">Kangyur</text><text x="1185" y="768" class="t m">Tengyur</text><text x="1185" y="796" class="t m">Indian works preserved in Tibetan</text><text x="1185" y="824" class="t m">plus Tibetan commentarial traditions</text>
<rect x="100" y="965" width="1350" height="80" rx="22" fill="#EFE8DA"/><text x="775" y="1000" text-anchor="middle" class="t b">Important｜重要：这不是一棵单向“进化树”，而是 Network / Graph。</text><text x="775" y="1028" text-anchor="middle" class="t m">同一部作品可能跨多传统留下平行文本、翻译、引用、改编或不同 recension。</text>
</svg>