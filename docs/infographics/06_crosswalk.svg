<rect width="1600" height="1000" fill="#FBF8F2"/>
<style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#1E2A44}.h{font-size:52px;font-weight:800}.s{font-size:22px;fill:#667085}.b{font-size:20px;font-weight:800}.m{font-size:15px;fill:#667085}.box{fill:#fff;stroke:#E0D7C9;stroke-width:2}.ln{stroke:#C8953E;stroke-width:5;fill:none}.core{fill:#7D6BA8}.w{fill:#fff;font-family:Arial,'Noto Sans SC',sans-serif;font-size:23px;font-weight:800}</style>
<text x="70" y="78" class="t h">What a Crosswalk Actually Does</text><text x="70" y="118" class="t s">以《心经》为例｜不是找一个“唯一文件”，而是把同一文本传统的证据节点连起来</text>
<rect x="575" y="175" width="450" height="90" rx="26" class="core"/><text x="800" y="220" text-anchor="middle" class="w">WORK｜Prajñāpāramitāhṛdaya</text><text x="800" y="248" text-anchor="middle" fill="#EEE8FA" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17">《般若波罗蜜多心经》文本传统</text>
<path d="M800 265V340M800 340H240M800 340H1360M800 340V390" class="ln"/>
<g transform="translate(90,390)"><rect width="330" height="190" rx="24" class="box"/><text x="165" y="48" text-anchor="middle" class="t b">Chinese｜汉文</text><text x="35" y="90" class="t b">T08n0251</text><text x="35" y="125" class="t m">玄奘译本是东亚最流行版本之一</text><text x="35" y="153" class="t m">另有其他汉译/相关版本</text></g>
<g transform="translate(475,390)"><rect width="330" height="190" rx="24" class="box"/><text x="165" y="48" text-anchor="middle" class="t b">Tibetan｜藏文</text><text x="35" y="90" class="t b">Toh 21</text><text x="35" y="123" class="t m">Kangyur Prajñāpāramitā section</text><text x="35" y="153" class="t m">另见 duplicate Toh 531</text></g>
<g transform="translate(860,390)"><rect width="330" height="190" rx="24" class="box"/><text x="165" y="48" text-anchor="middle" class="t b">Sanskrit｜梵文</text><text x="35" y="90" class="t b">Multiple witnesses</text><text x="35" y="123" class="t m">不同写本 / 校勘本 / 长短形态</text><text x="35" y="153" class="t m">不是一个神奇“原版 PDF”</text></g>
<g transform="translate(1245,390)"><rect width="270" height="190" rx="24" class="box"/><text x="135" y="48" text-anchor="middle" class="t b">Scholarship</text><text x="30" y="90" class="t m">dating</text><text x="30" y="118" class="t m">recension relations</text><text x="30" y="146" class="t m">translation history</text></g>
<path d="M255 580V675H1350V580M640 580V675M1025 580V675" class="ln"/>
<rect x="250" y="675" width="1100" height="150" rx="28" fill="#fff" stroke="#E0D7C9" stroke-width="2"/><text x="800" y="723" text-anchor="middle" class="t b">COMPARE｜比较：顺序 · 词语 · 增删 · 说话者 · 咒语 · 标题 · 序跋 · 写本年代</text><text x="800" y="760" text-anchor="middle" class="t s">然后才谈：哪些可能更早？哪些是后期编辑？哪些只是翻译选择？</text><text x="800" y="798" text-anchor="middle" class="t s">Conclusion = confidence statement, not “真 / 假”二选一。</text>
<text x="800" y="910" text-anchor="middle" class="t b">WORK ≠ VERSION ≠ WITNESS · PARALLEL ≠ IDENTICAL</text>
