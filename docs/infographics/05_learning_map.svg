<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#FBF8F2"/>
<style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#1E2A44}.h{font-size:52px;font-weight:800}.s{font-size:22px;fill:#667085}.b{font-size:21px;font-weight:800}.m{font-size:16px;fill:#667085}.c1{fill:#FFF;stroke:#D7C49F;stroke-width:3}.c2{fill:#FFF;stroke:#BEB0D7;stroke-width:3}.c3{fill:#FFF;stroke:#99BDBB;stroke-width:3}</style>
<text x="70" y="80" class="t h">Three Ways to Learn the Buddhist Canon</text><text x="70" y="120" class="t s">三种学习模式｜不是所有人都要从第一页开始</text>
<g transform="translate(90,210)"><rect width="440" height="600" rx="30" class="c1"/><text x="220" y="65" text-anchor="middle" class="t b">🌱 GUIDED｜小白模式</text><text x="45" y="120" class="t b">故事 → 地图 → 概念 → 经典 → 原典</text><text x="45" y="175" class="t m">1. 用故事知道“为什么重要”</text><text x="45" y="215" class="t m">2. 在 Timeline 找位置</text><text x="45" y="255" class="t m">3. 用 Concept Card 学核心词</text><text x="45" y="295" class="t m">4. 看一部 Key Text 的结构</text><text x="45" y="335" class="t m">5. 最后才进入原文/译文对照</text><rect x="45" y="410" width="350" height="100" rx="18" fill="#F8F0E2"/><text x="70" y="450" class="t b">适合：</text><text x="70" y="480" class="t m">完全不懂佛典，但想建立全局的人。</text></g>
<g transform="translate(580,210)"><rect width="440" height="600" rx="30" class="c2"/><text x="220" y="65" text-anchor="middle" class="t b">⚡ EXPLORER｜高速模式</text><text x="45" y="120" class="t b">问题 → 索引 → Parallel → 争议</text><text x="45" y="175" class="t m">1. 先提出问题：梦？轮回？空？</text><text x="45" y="215" class="t m">2. 搜 canonical term / ID</text><text x="45" y="255" class="t m">3. 同时调出跨语言平行文本</text><text x="45" y="295" class="t m">4. 看年代 / 版本 / 分支</text><text x="45" y="335" class="t m">5. 直接进入 disputed points</text><rect x="45" y="410" width="350" height="100" rx="18" fill="#F1EDF8"/><text x="70" y="450" class="t b">适合：</text><text x="70" y="480" class="t m">学习速度快、喜欢先建 Map 再钻研的人。</text></g>
<g transform="translate(1070,210)"><rect width="440" height="600" rx="30" class="c3"/><text x="220" y="65" text-anchor="middle" class="t b">🔬 SCHOLAR｜研究模式</text><text x="45" y="120" class="t b">ID → Version → Witness → Bibliography</text><text x="45" y="175" class="t m">1. 锁定 Work / Version ID</text><text x="45" y="215" class="t m">2. 调写本 / 刻本 / shelfmark</text><text x="45" y="255" class="t m">3. 比对校勘与翻译差异</text><text x="45" y="295" class="t m">4. 查 philology / paleography</text><text x="45" y="335" class="t m">5. 输出带 citation 的重建结论</text><rect x="45" y="410" width="350" height="100" rx="18" fill="#EAF3F2"/><text x="70" y="450" class="t b">适合：</text><text x="70" y="480" class="t m">研究者、翻译者、深度文本考据。</text></g>
<text x="800" y="900" text-anchor="middle" class="t b">共同循环：Retrieval → Spacing → Interleaving → Explain / Teach → Update the Map</text>
</svg>