<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#FBF8F2"/>
<style>.t{font-family:Arial,'Noto Sans SC',sans-serif;fill:#1E2A44}.h{font-size:54px;font-weight:800}.s{font-size:24px;fill:#667085}.y{font-size:22px;font-weight:800;fill:#C8953E}.b{font-size:21px;font-weight:700}.m{font-size:16px;fill:#667085}.line{stroke:#CFC4B4;stroke-width:5}.dot{fill:#7D6BA8;stroke:#fff;stroke-width:5}</style>
<text x="80" y="90" class="t h">2500 Years of Buddhist Texts</text><text x="80" y="130" class="t s">佛典形成、传播与保存时间线｜不是“一本书”的历史</text>
<line x1="120" y1="510" x2="1490" y2="510" class="line"/>
<g><circle cx="150" cy="510" r="16" class="dot"/><text x="120" y="440" class="t y">c. 5th–4th BCE</text><text x="90" y="475" class="t b">Early oral transmission</text><text x="90" y="555" class="t m">早期口传、共同诵持</text></g>
<g><circle cx="370" cy="510" r="16" class="dot"/><text x="320" y="600" class="t y">3rd–1st BCE</text><text x="300" y="635" class="t b">Regional / school traditions</text><text x="300" y="670" class="t m">地区与部派传统分化</text></g>
<g><circle cx="590" cy="510" r="16" class="dot"/><text x="525" y="405" class="t y">1st BCE–3rd CE</text><text x="500" y="440" class="t b">Early manuscripts</text><text x="500" y="475" class="t m">犍陀罗等早期写本证据</text></g>
<g><circle cx="810" cy="510" r="16" class="dot"/><text x="740" y="600" class="t y">2nd–7th CE</text><text x="700" y="635" class="t b">Silk Road translation age</text><text x="700" y="670" class="t m">中亚—中国大规模译经</text></g>
<g><circle cx="1030" cy="510" r="16" class="dot"/><text x="970" y="405" class="t y">7th–13th CE</text><text x="920" y="440" class="t b">Xuanzang & Tibetan translation</text><text x="920" y="475" class="t m">唐代译场、藏译体系逐步形成</text></g>
<g><circle cx="1250" cy="510" r="16" class="dot"/><text x="1190" y="600" class="t y">11th–14th CE</text><text x="1140" y="635" class="t b">Great canon editions</text><text x="1140" y="670" class="t m">高丽藏、东亚大藏经版本工程</text></g>
<g><circle cx="1450" cy="510" r="16" class="dot"/><text x="1360" y="405" class="t y">20th–21st CE</text><text x="1320" y="440" class="t b">Digital textual criticism</text><text x="1320" y="475" class="t m">Taishō · CBETA · SAT · SuttaCentral · BDRC</text></g>
<rect x="80" y="760" width="1440" height="150" rx="28" fill="#fff" stroke="#E7DFD2"/><text x="120" y="815" class="t b">Key idea｜核心理解</text><text x="120" y="855" class="t s">“经典”经历口传 → 地区传统 → 写本 → 翻译 → 编纂 → 刻印 → 数字校勘。</text><text x="120" y="892" class="t s">研究目标不是寻找神话式“唯一原本”，而是重建证据允许我们看到的更早文本层。</text>
</svg>