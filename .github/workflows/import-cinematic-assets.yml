name: Import approved cinematic website artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-cinematic-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dharma-cinematic-assets
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Assemble the approved background and six portal images
        run: |
          python -m pip install Pillow
          python - <<'PY'
          import io,pathlib,urllib.request,urllib.parse,hashlib,json,concurrent.futures
          from PIL import Image
          # Each page contains a spatial crop of the SAME approved image, not new artwork.
          # Native crops are 592x296, below the preview area limit; no low-res full-scene upscale.
          records=[
          ('20260919T205206Z',21102,'2406078e0609cea6a234d1dd601bbbf9be933725f75027dbdfbe538dcf30dbf4'),
          ('20260919T140059Z',45769,'1826475780141b22a5d4ce8eb931322e26eea484b4df94b94b8a1d0d4bb47f8a'),
          ('20260919T222805Z',15343,'8bec795afe3e6a26ae8637d4b5a9832f54e755795c92072ca4a4a4d6e9718bb0'),
          ('20260919T125807Z',49541,'501c993fea2220a470ab5a36e2da6701fd309519189f5f3fd61ad9501b68c08d'),
          ('20260919T131007Z',48821,'5215f203011ccda457e4e214b927fcb121cd3082c68ce6347cf825df7f88f640'),
          ('20260919T082558Z',65890,'3c484a793306d22fecb66913af4f687fe4b95a40ce379840534da746494c7167'),
          ('20260919T133135Z',47553,'df441c2306a37f2ff908b22e2e364b573607dc4747a177100c4da79944117539'),
          ('20260919T122101Z',51787,'ad30904e052304a9530f9b2b382b9b4cdb46ca74f68854fb8d6c4312b661caed'),
          ('20260919T045200Z',78728,'998442498c8c0650c992214cb7139a58c5da6fe61b0933b0e4b43cdbc347f034'),
          ('20260919T114042Z',54206,'3677d920b26940a07db3a123c32ae4eb754ebb85b9940615ebc4e9412952318f'),
          ('20260919T165828Z',35153,'e9c3dfe204baa334c22648a4ba16c7369d4456733ea566d75e798fc5093c8052'),
          ('20260919T090311Z',63670,'f640aef7d74a08bf140f84afda29db48add73eef47cbc6d8def00b190d48a5c8'),
          ('20260919T124659Z',50242,'bbad63d1690a2added358935464b5f0318f60578450ff5abaf0016c8faf38687'),
          ('20260919T070913Z',70508,'178e43e0d50080212c641d6a9e8ebf6a822f44bb0df8f765e5dd27bfddc2fdf2'),
          ('20260919T081037Z',66824,'66f8a7b42562cee278e22f3a2fa412a2e125b11a5bf4fd670a985c9231e82986')]
          def retrieve(entry):
              i,(date,expires,sig)=entry
              end='02:43:48' if i<=5 else '02:44:08' if i<=10 else '02:44:21'
              params={'X-Amz-Algorithm':'AWS4-HMAC-SHA256','X-Amz-Credential':'AKIAQYCGKMUHVZ3RB6IW/20260919/us-east-1/s3/aws4_request','X-Amz-Date':date,'X-Amz-Expires':str(expires),'X-Amz-Signature':sig,'X-Amz-SignedHeaders':'host','response-expires':'Sun, 20 Sep 2026 '+end+' GMT'}
              url=f'https://s3.amazonaws.com/document-export-us1.canva.com/1JwIc/DAHVsZ1JwIc/1/thumbnail/{i:04d}.png?'+urllib.parse.urlencode(params,quote_via=urllib.parse.quote)
              with urllib.request.urlopen(url,timeout=40) as r:raw=r.read()
              im=Image.open(io.BytesIO(raw)).convert('RGB');im.load()
              print('Tile',i,'dimensions',im.size,'bytes',len(raw))
              assert im.width>=590 and im.height>=295, 'Tile resolution is insufficient'
              return im.resize((592,296),Image.Resampling.LANCZOS)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:tiles=list(pool.map(retrieve,enumerate(records,1)))
          out=pathlib.Path('web/garden/cinematic-assets');out.mkdir(parents=True,exist_ok=True)
          hero=Image.new('RGB',(1776,888))
          for i,tile in enumerate(tiles[:9]):hero.paste(tile,((i%3)*592,(i//3)*296))
          hero.save(out/'garden.png',optimize=True)
          hero.save(out/'sacred-world.webp',quality=94,method=6)
          hero.crop((0,0,936,888)).save(out/'sacred-world-mobile.webp',quality=92,method=6)
          for name,tile,size in zip(['map','texts','places','people','timeline','library'],tiles[9:],[(227,120),(227,120),(226,120),(224,120),(227,120),(226,120)]):
              tile.resize(size,Image.Resampling.LANCZOS).save(out/(name+'.webp'),quality=94,method=6)
          info={'source':'approved no-text cinematic background and existing portal images','hero_dimensions':[1776,888],'transfer':'spatial tiles reassembled in original row-major order','contains_navigation_or_text':False,'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.suffix in ['.webp','.png']}}
          (out/'art-provenance.json').write_text(json.dumps(info,indent=2))
          print('Full-resolution scene assembled:',hero.size)
          PY
      - name: Save permanent assets in the existing repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/garden/cinematic-assets
          if ! git diff --cached --quiet; then
            git commit -m 'art: archive approved cinematic hero and all six portal images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-approved-assets
          path: web/garden/cinematic-assets
          if-no-files-found: warn
