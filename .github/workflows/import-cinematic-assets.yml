name: Import approved cinematic website artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-cinematic-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dharma-cinematic-assets
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Retrieve the uploaded scene at original resolution
        run: |
          python -m pip install Pillow
          python - <<'PY'
          import io,json,pathlib,urllib.request,urllib.parse
          from PIL import Image
          base='https://media.canva.com/v2/image-resize/format:JPG/height:887/quality:95/uri:ifs%3A%2F%2FM%2F32953bc9-a45f-44cf-b1fe-587518712c3e/watermark:F/width:1774'
          params={'csig':'AAAAAAAAAAAAAAAAAAAAAOmjt3j0htqPoT4POZs4R2W8WCckUdCrcbh8OS7UydXK','exp':'1789882409','osig':'AAAAAAAAAAAAAAAAAAAAANFlv59od-CthbdtxJBujiuUOuPkqsMvagztE7iePEcH','signer':'media-rpc','x-canva-quality':'thumbnail'}
          image=None
          for variant in [params,{k:v for k,v in params.items() if k not in ['csig','x-canva-quality']}]:
              try:
                  req=urllib.request.Request(base+'?'+urllib.parse.urlencode(variant),headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=35) as r:raw=r.read()
                  im=Image.open(io.BytesIO(raw));im.load()
                  print('Retrieved image dimensions:',im.size,'bytes:',len(raw))
                  if im.width>=1600 and im.height>=800:
                      image=im.convert('RGB');break
              except Exception as e:print('Asset transfer result:',type(e).__name__,getattr(e,'code',''))
          if image is None:raise SystemExit('Full-resolution approved artwork was not available. Existing public website was not changed.')
          out=pathlib.Path('web/garden/cinematic-assets');out.mkdir(parents=True,exist_ok=True)
          image.save(out/'garden.png',optimize=True)
          image.save(out/'sacred-world.webp',quality=92,method=6)
          image.save(out/'sacred-world-mobile.webp',quality=88,method=6)
          print('Approved cinematic scene saved without text or UI overlays.')
          PY
      - name: Save permanent assets in the existing repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/garden/cinematic-assets
          if ! git diff --cached --quiet; then
            git commit -m 'art: archive full-resolution cinematic Buddhist world scene'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-approved-assets
          path: web/garden/cinematic-assets
          if-no-files-found: warn
