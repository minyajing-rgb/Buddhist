name: Quantum bilingual site - build publish verify
on:
  push:
    branches: [main]
    paths:
      - 'quantum/site/**'
      - 'quantum/build.py'
      - 'quantum/data/CURRENT.json'
      - 'quantum/data/atlas*.json'
      - 'tests/quantum_e2e.py'
      - '.github/workflows/quantum-site.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shared-github-pages-site
  cancel-in-progress: false
jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Compile portable site from canonical content
        run: |
          python quantum/build.py
          node --check quantum/site/app.js
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Verify site over local HTTP
        run: |
          python -m http.server 8080 --directory docs > /tmp/quantum-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python tests/quantum_e2e.py --url http://127.0.0.1:8080/quantum/ --out build/quantum-local-http
      - name: Archive generated HTML without replacing the Buddhist site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quantum/index.html docs/quantum/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(quantum): archive tested cosmic bilingual site'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage visitor pages only, never raw research directories
        run: |
          test -f docs/garden/index.html
          python scripts/build_garden.py --stage-only
          python - <<'PY'
          from pathlib import Path
          root=Path('build/public')
          assert (root/'index.html').read_bytes()==Path('docs/garden/index.html').read_bytes()
          assert (root/'quantum/index.html').read_bytes()==Path('docs/quantum/index.html').read_bytes()
          for name in ['review','archive','data','release.json','public_deployment.json']:
              assert not (root/name).exists(), 'Internal Dharma content must not be republished'
          PY
      - name: Upload public garden plus quantum subsite
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/public
      - name: Deploy to the existing GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Wait for exact pages and verify the shared-site boundary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import hashlib,os,time,urllib.request,urllib.error
          from pathlib import Path
          expected=hashlib.sha256(Path('docs/quantum/index.html').read_bytes()).hexdigest()
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          url=base+'quantum/'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('QUANTUM_URL='+url+'\n')
          for attempt in range(50):
              try:
                  req=urllib.request.Request(url+'?release_check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read()
                      if r.status==200 and hashlib.sha256(body).hexdigest()==expected:break
              except Exception as e:print(type(e).__name__,str(e)[:160])
              time.sleep(10)
          else:raise SystemExit('Public quantum deployment did not match generated bytes')
          with urllib.request.urlopen(base+'?garden_preservation='+str(time.time_ns()),timeout=30) as r:
              assert hashlib.sha256(r.read()).hexdigest()==hashlib.sha256(Path('docs/garden/index.html').read_bytes()).hexdigest(), 'Garden homepage changed unexpectedly'
          for hidden in ['review/index.html','release.json','public_deployment.json','data/CURRENT.json']:
              try:
                  with urllib.request.urlopen(base+hidden,timeout=30) as r:raise AssertionError('Internal path was served: '+hidden)
              except urllib.error.HTTPError as e:assert e.code==404,(hidden,e.code)
          print('Quantum verified, garden preserved, internal research routes remain 404.')
          PY
      - name: Run bilingual and interaction checks on the public URL
        run: python tests/quantum_e2e.py --url "$QUANTUM_URL" --out build/quantum-public
      - name: Archive public verification record
        run: |
          cp build/quantum-public/qa.json quantum/data/qa.v0.2.public.json
          git add quantum/data/qa.v0.2.public.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(quantum): archive public HTTP verification and preserved garden boundary'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo '## Quantum public verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Public site: $QUANTUM_URL" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('build/quantum-public/qa.json'))
          print('Passed checks:',d['passed'])
          print('Research completeness, independent physics review, and custom DNS are not asserted by these UI tests.')
          PY
      - name: Save browser screenshots, reports and portable HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quriatlas-cosmic-bilingual
          path: |
            build/quantum-local-http/
            build/quantum-public/
            quantum/index.html
          retention-days: 30
          if-no-files-found: warn
