name: Publish Dharma Atlas living beta
on:
  push:
    branches: [main]
    paths:
      - 'web/garden/**'
      - 'site/**'
      - 'scripts/build_atlas.py'
      - 'scripts/finalize_review.py'
      - 'scripts/prepare_public_beta.py'
      - 'scripts/build_garden.py'
      - 'scripts/render_garden.py'
      - 'scripts/finish_garden.py'
      - 'data/**'
      - 'skills/global-knowledge-atlas/**'
      - 'docs/stories/**'
      - 'docs/infographics/**'
      - 'tests/garden_smoke.py'
      - '.github/workflows/publish-atlas.yml'
  workflow_run:
    workflows: ['Import authority metadata', 'Build complete research preview']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shared-github-pages-site
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install rendering and browser verification
        run: |
          python -m pip install 'CairoSVG==2.8.2' 'playwright==1.57.0'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Build research inputs, then project only visitor content
        run: |
          python scripts/build_atlas.py
          python scripts/finalize_review.py
          python scripts/prepare_public_beta.py
          python scripts/build_garden.py
          python scripts/finish_garden.py
          node --check web/garden/garden.js
          node --check web/garden/enhancements.js
      - name: Test the actual public distribution over local HTTP
        run: |
          python -m http.server 8080 --directory build/public > /tmp/garden-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python tests/garden_smoke.py --url http://127.0.0.1:8080/ --out build/garden-local
      - name: Archive website source and visitor build without deleting research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('data/CURRENT.json');d=json.loads(p.read_text())
          d.setdefault('site',{}).update({'public_root':'docs/garden/index.html','distribution':'build/public','style':'luminous illustrated lotus garden and gilded pavilions','languages':['zh','en'],'public_content_policy':'visitor allowlist; no raw research objects, repository links or audit exports','custom_domain_modified':False})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          git add docs/garden docs/index.html data/CURRENT.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: archive Garden of Dharma public website and original garden artwork'
            git stash --include-untracked
            git pull --rebase origin main
            git push origin HEAD:main
            git stash pop || true
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/public
      - name: Publish only visitor files and preserve quantum subsite
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the exact public homepage and preserved subsite
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,time,urllib.request
          base=os.environ['PAGE_URL'];expected=hashlib.sha256(pathlib.Path('build/public/index.html').read_bytes()).hexdigest()
          for attempt in range(36):
              try:
                  with urllib.request.urlopen(base+'?verify='+str(time.time_ns()),timeout=25) as r:
                      body=r.read()
                      if r.status==200 and hashlib.sha256(body).hexdigest()==expected:break
              except Exception as e:print(type(e).__name__,str(e)[:100])
              time.sleep(5)
          else:raise SystemExit('Public homepage did not match the tested garden build')
          report=json.loads(pathlib.Path('build/garden-release.json').read_text())
          report.update({'url':base,'status':'published_and_https_hash_verified','http_status':200,'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'workflow_run':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA']})
          q=pathlib.Path('build/public/quantum/index.html')
          if q.exists():
              with urllib.request.urlopen(base.rstrip('/')+'/quantum/?verify='+str(time.time_ns()),timeout=30) as r:
                  report['quantum_preserved']=r.status==200 and hashlib.sha256(r.read()).hexdigest()==hashlib.sha256(q.read_bytes()).hexdigest()
                  assert report['quantum_preserved']
          pathlib.Path('build/garden-public').mkdir(parents=True,exist_ok=True)
          pathlib.Path('build/garden-public/deployment.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='public_files'},ensure_ascii=False))
          PY
      - name: Test bilingual interactions and the serving boundary on public HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/garden_smoke.py --url "$PAGE_URL" --out build/garden-public
      - name: Keep test reports in the repository, not in the public distribution
        run: |
          mkdir -p status
          cp build/garden-public/qa.json status/garden-public-qa.json
          cp build/garden-public/deployment.json status/garden-deployment.json
          git add status/garden-public-qa.json status/garden-deployment.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa: verify live garden, bilingual flows and hidden research URLs'
            git stash --include-untracked
            git pull --rebase origin main
            git push origin HEAD:main
            git stash pop || true
          fi
          echo '## Garden of Dharma live' >> "$GITHUB_STEP_SUMMARY"
          cat status/garden-public-qa.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save actual screenshots, reports and website files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dharma-garden-website
          path: |
            build/garden-local/
            build/garden-public/
            build/garden-release.json
            build/public/
            docs/garden/
            web/garden/
            scripts/build_garden.py
            scripts/render_garden.py
            scripts/finish_garden.py
            tests/garden_smoke.py
          retention-days: 30
          if-no-files-found: warn
